<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d16"><title>JULIEN HUB</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d16;color:#fff;font-family:Inter,system-ui,Arial}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:900;letter-spacing:.22em;font-size:clamp(16px,3vw,25px);text-shadow:0 2px 20px #000}.pill{background:#101b2bd9;border:1px solid #ffffff22;border-radius:30px;padding:9px 14px;color:#c9d8e9;font-size:12px}.help{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#101b2bd9;border:1px solid #ffffff22;border-radius:14px;padding:10px 15px;color:#d8e4f1;font-size:12px;text-align:center;max-width:90%;white-space:nowrap}.cross{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #b9e8ff;border-radius:50%;transform:translate(-50%,-50%);opacity:.8}.panel{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);width:min(440px,calc(100% - 28px));padding:18px;border-radius:20px;background:#0d1725ee;border:1px solid #6abaff66;box-shadow:0 20px 80px #0009;display:none;pointer-events:auto;text-align:center}.panel h2{margin:0 0 6px}.panel p{color:#b8c8da;font-size:13px}.panel a,.panel button{display:inline-block;background:#b7e2ff;color:#08111c;text-decoration:none;font-weight:800;border:0;border-radius:12px;padding:12px 18px;margin:5px;cursor:pointer}.panel .secondary{background:#24364a;color:white}.mobile{position:absolute;bottom:80px;left:15px;display:none;pointer-events:auto;gap:7px}.mobile button{width:48px;height:48px;border:1px solid #ffffff55;background:#142238cc;color:#fff;border-radius:14px;font-size:19px;touch-action:none}.look{position:absolute;right:16px;bottom:88px;color:#b9c9db;background:#142238bb;padding:10px;border-radius:12px;font-size:11px;display:none}@media(max-width:700px){.mobile,.look{display:flex}.help{bottom:18px;font-size:10px;white-space:normal}.pill{font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body><div id="hud"><div class="top"><div class="logo">JULIEN <span style="color:#8bd2ff">HUB</span></div><div class="pill">3D APP-WELT · BETA</div></div><div class="cross"></div><div class="help">PC: WASD bewegen · Maus umsehen · E oder Portal anklicken · ESC Maus lösen<br>Handy: Richtungstasten nutzen · zum Umschauen rechts wischen</div><div class="panel" id="panel"><h2 id="ptitle">Willkommen</h2><p id="pdesc"></p><a id="launch" href="#">Öffnen</a><button class="secondary" id="close">Weiter erkunden</button></div><div class="mobile" id="mobile"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><div class="look" id="look">Zum Umschauen wischen</div></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080d16);scene.fog=new THREE.Fog(0x080d16,18,58);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,100);camera.position.set(0,1.7,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bcaff,0x17202c,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-5,10,7);sun.castShadow=true;scene.add(sun);
const mat=(c,metal=0,rough=.65)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x111a27,.25,.8));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(100,100,0x29445e,0x1b2b3e);grid.position.y=.012;scene.add(grid);
function box(x,y,z,sx,sy,sz,m){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
// futuristic plaza architecture
for(let i=0;i<12;i++){let a=i*Math.PI/6;let x=Math.cos(a)*17,z=Math.sin(a)*17;box(x,2.5,z,2.2,5,2.2,mat(i%2?0x17283b:0x202d40,.4));let glow=box(x,5.08,z,1.7,.08,1.7,mat(0x68c9ff,.2,.25));glow.material.emissive=new THREE.Color(0x1466a0);glow.material.emissiveIntensity=2;}
// central hub platform
const disk=new THREE.Mesh(new THREE.CylinderGeometry(5.2,5.7,.35,64),mat(0x1a2b40,.6,.3));disk.position.set(0,.18,0);disk.receiveShadow=true;scene.add(disk);let ring=new THREE.Mesh(new THREE.TorusGeometry(5.3,.045,8,100),new THREE.MeshBasicMaterial({color:0x69cfff}));ring.rotation.x=Math.PI/2;ring.position.y=.4;scene.add(ring);
// floating sign
const sign=box(0,4.3,-3.6,5.8,1.3,.18,mat(0x0e1b2c,.5,.25));
function makeLabel(text,x,y,z,color='#d9f1ff',size=64){const c=document.createElement('canvas');c.width=1024;c.height=180;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.font=`900 ${size}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillText(text,512,90);const tex=new THREE.CanvasTexture(c);const mesh=new THREE.Mesh(new THREE.PlaneGeometry(5.4,.95),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));mesh.position.set(x,y,z);scene.add(mesh);return mesh}makeLabel('JULIEN HUB',0,4.32,-3.48);
const portals=[{name:'SHK LERNTRAINER',desc:'Lernfelder, Fragen, Wartung, Fehlercodes und Prüfungssimulation.',url:'shk-lerntrainer.html',x:-6,z:-5,color:0x38c99a},{name:'VÉRNOIR SHOP',desc:'Dein Streetwear-Shop · First Drop 001.',url:'vernoir-shop.html',x:6,z:-5,color:0xd7d7d7},{name:'MEINE 3D-SPIELE',desc:'Hier kommen deine eigenen spielbaren 3D-Spiele hinein. Dieser Bereich ist vorbereitet.',url:null,x:-6,z:4,color:0x8c9cff},{name:'NEUE PROJEKTE',desc:'Platz für weitere Apps, Webseiten und Spiele.',url:null,x:6,z:4,color:0xe3b86b}];
const targets=[];for(const p of portals){let base=box(p.x,1.65,p.z,3.4,3.3,.35,mat(0x15253a,.55,.28));let glow=box(p.x,1.65,p.z-.2,3.08,2.98,.08,new THREE.MeshStandardMaterial({color:p.color,emissive:p.color,emissiveIntensity:.75,metalness:.2,roughness:.25}));let inner=box(p.x,1.65,p.z-.26,2.86,2.76,.07,mat(0x101b2b,.35,.35));let label=makeLabel(p.name,p.x,1.85,p.z-.31,'#ffffff',p.name.length>16?43:55);label.scale.set(.58,.58,.58);let floorRing=new THREE.Mesh(new THREE.TorusGeometry(1.8,.035,8,64),new THREE.MeshBasicMaterial({color:p.color}));floorRing.rotation.x=Math.PI/2;floorRing.position.set(p.x,.05,p.z);scene.add(floorRing);targets.push({p,base,glow,inner,label});}
// decorative lights
for(let i=0;i<22;i++){let l=new THREE.PointLight(i%2?0x4d9dff:0x53d7bb,.8,8);let a=i/22*Math.PI*2;l.position.set(Math.cos(a)*10,1.4,Math.sin(a)*10);scene.add(l)}
let yaw=0,pitch=0;const keys={};let selected=null;const panel=document.getElementById('panel');function show(t){selected=t;document.getElementById('ptitle').textContent=t.p.name;document.getElementById('pdesc').textContent=t.p.desc;let a=document.getElementById('launch');if(t.p.url){a.href=t.p.url;a.textContent='App öffnen';a.style.display='inline-block'}else{a.style.display='none'}panel.style.display='block'}document.getElementById('close').onclick=()=>panel.style.display='none';
document.getElementById('launch').addEventListener('click',e=>{if(!selected||!selected.p.url){e.preventDefault();return;}e.currentTarget.href=new URL(selected.p.url,window.location.href).href;});
const ray=new THREE.Raycaster();function interact(){ray.setFromCamera(new THREE.Vector2(0,0),camera);let hits=ray.intersectObjects(targets.map(t=>t.inner));if(hits.length){let t=targets.find(t=>t.inner===hits[0].object);show(t);return}let nearest=null,dist=3;for(const t of targets){let d=camera.position.distanceTo(new THREE.Vector3(t.p.x,1.6,t.p.z));if(d<dist){dist=d;nearest=t}}if(nearest)show(nearest)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e' && !e.repeat)interact();if(e.key==='Escape')document.exitPointerLock?.()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('click',(e)=>{
  const rect=renderer.domElement.getBoundingClientRect();
  const pointer=new THREE.Vector2(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
  ray.setFromCamera(pointer,camera);
  const hits=ray.intersectObjects(targets.map(t=>t.inner),false);
  if(hits.length){const t=targets.find(item=>item.inner===hits[0].object);if(t){show(t);return;}}
  if(innerWidth>700 && document.pointerLockElement!==renderer.domElement){renderer.domElement.requestPointerLock?.();}
});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-1.1,Math.min(1.1,pitch))}});
// touch look and movement
let touchStart=null;renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(touchStart&&e.touches.length){let t=e.touches[0];yaw-=(t.clientX-touchStart.x)*.004;pitch-=(t.clientY-touchStart.y)*.003;pitch=Math.max(-1,Math.min(1,pitch));touchStart={x:t.clientX,y:t.clientY}}},{passive:true});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true},{passive:false});b.addEventListener('touchend',()=>keys[k]=false);b.addEventListener('mousedown',()=>keys[k]=true);b.addEventListener('mouseup',()=>keys[k]=false)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));let right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let move=new THREE.Vector3();if(keys.w||keys.arrowup)move.add(forward);if(keys.s||keys.arrowdown)move.sub(forward);if(keys.d||keys.arrowright)move.add(right);if(keys.a||keys.arrowleft)move.sub(right);if(move.lengthSq()){move.normalize().multiplyScalar(5*dt);camera.position.add(move)}camera.position.x=THREE.MathUtils.clamp(camera.position.x,-22,22);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-22,22);camera.position.y=1.7;targets.forEach((t,i)=>{t.glow.material.emissiveIntensity=.55+Math.sin(clock.elapsedTime*2+i)*.18});renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
